apiVersion: v1
kind: Pod
metadata:
  name: restart-test-loop
  namespace: default
  labels:
    app.kubernetes.io/name: restart-test-loop
    app.kubernetes.io/component: alert-test
spec:
  restartPolicy: Always
  containers:
    - name: restart-test-loop
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "exit 1"]
